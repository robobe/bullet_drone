<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
<title id="title">Simulation ↔ Betaflight SITL: bridge overview</title><desc id="desc">Simulation physics produces IMU and barometer measurements. The FDM encoder sends 144-byte packets to SITL UDP port 9003. SITL returns 16-byte motor packets to simulation UDP port 9002. A separate application uses MSP TCP 5761.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1280" height="850" fill="#ffffff"/>
<style>text { font-family: 'DejaVu Sans', sans-serif; fill: #172b4d; } .title {font-size:28px;font-weight:700} .heading {font-size:20px;font-weight:700} .body {font-size:17px} .small {font-size:15px;fill:#475569} .mono {font-family:'DejaVu Sans Mono',monospace;font-size:17px} .blue {fill:#1d4ed8} .teal {fill:#0f766e}</style>
<text x="35" y="48" class="title" text-anchor="start">
<tspan x="35" dy="0">Simulation ↔ Betaflight SITL</tspan>
</text>
<text x="35" y="80" class="body" text-anchor="start">
<tspan x="35" dy="0">Upstream Gazebo-compatible target • default host 127.0.0.1</tspan>
</text>
<rect x="880" y="100" width="360" height="100" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1060" y="137" class="heading" text-anchor="middle">
<tspan x="1060" dy="0">Application / launcher</tspan>
</text>
<text x="1060" y="168" class="small" text-anchor="middle">
<tspan x="1060" dy="0">RC, configuration and feedback</tspan>
</text>
<path d="M 1060 200 L 1060 348" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="1080" y="248" class="small" text-anchor="start">
<tspan x="1080" dy="0">MSP over TCP</tspan>
<tspan x="1080" dy="25">SITL listens :5761</tspan>
<tspan x="1080" dy="25">Context only</tspan>
</text>
<rect x="30" y="180" width="650" height="540" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="55" y="218" class="heading" text-anchor="start">
<tspan x="55" dy="0">Simulation process</tspan>
</text>
<rect x="60" y="250" width="230" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="175" y="288" class="heading" text-anchor="middle">
<tspan x="175" dy="0">Bullet physics</tspan>
</text>
<text x="175" y="319" class="small" text-anchor="middle">
<tspan x="175" dy="0">State after each step</tspan>
</text>
<rect x="350" y="250" width="290" height="100" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
<text x="495" y="288" class="heading" text-anchor="middle">
<tspan x="495" dy="0">IMU + barometer</tspan>
</text>
<text x="495" y="319" class="small" text-anchor="middle">
<tspan x="495" dy="0">Noise / bias / filtering</tspan>
</text>
<path d="M 290 300 L 348 300" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 270 350 L 270 515 L 348 515" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="285" y="397" class="small" text-anchor="start">
<tspan x="285" dy="0">Truth</tspan>
<tspan x="285" dy="24">pose</tspan>
</text>
<path d="M 495 350 L 495 428" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="515" y="393" class="small" text-anchor="start">
<tspan x="515" dy="0">Readings</tspan>
</text>
<rect x="350" y="430" width="290" height="110" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="495" y="465" class="heading" text-anchor="middle">
<tspan x="495" dy="0">FDM encoder</tspan>
</text>
<text x="495" y="495" class="small" text-anchor="middle">
<tspan x="495" dy="0">Sensors + truth pose</tspan>
<tspan x="495" dy="24">18 × float64 = 144 bytes</tspan>
</text>
<rect x="920" y="350" width="320" height="220" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<text x="1080" y="390" class="heading" text-anchor="middle">
<tspan x="1080" dy="0">Betaflight SITL</tspan>
</text>
<text x="1080" y="424" class="body" text-anchor="middle">
<tspan x="1080" dy="0">Virtual sensor devices</tspan>
<tspan x="1080" dy="30">Estimator → PID → mixer</tspan>
</text>
<text x="1080" y="505" class="small" text-anchor="middle">
<tspan x="1080" dy="0">FDM listener :9003</tspan>
<tspan x="1080" dy="27">Motor sender → :9002</tspan>
</text>
<path d="M 640 485 L 918 485" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="780" y="417" class="small" text-anchor="middle">
<tspan x="780" dy="0">FDM →</tspan>
<tspan x="780" dy="24">UDP destination :9003</tspan>
<tspan x="780" dy="24">144 bytes</tspan>
</text>
<rect x="60" y="580" width="580" height="100" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
<text x="350" y="616" class="heading" text-anchor="middle">
<tspan x="350" dy="0">Motor adapter • listens on :9002</tspan>
</text>
<text x="350" y="650" class="small" text-anchor="middle">
<tspan x="350" dy="0">Validate → reorder → target rad/s → actuators</tspan>
</text>
<path d="M 1080 570 L 1080 630 L 642 630" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="820" y="588" class="small" text-anchor="middle">
<tspan x="820" dy="0">← Motors over UDP :9002</tspan>
<tspan x="820" dy="25">4 × float32 = 16 bytes</tspan>
</text>
<path d="M 80 580 L 80 352" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="105" y="448" class="small" text-anchor="start">
<tspan x="105" dy="0">Actuators and</tspan>
<tspan x="105" dy="27">rotor forces</tspan>
<tspan x="105" dy="27">advance physics</tspan>
</text>
<rect x="30" y="755" width="1210" height="65" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="50" y="782" class="small" text-anchor="start">
<tspan x="50" dy="0">Unmodified upstream 2026.6.2. Profile selects MSP RC and disables GPS and magnetometer use.</tspan>
<tspan x="50" dy="24">FDM and motors are detailed here. MSP is application-owned and shown only for context.</tspan>
</text>
</svg>
