<text x="85" y="840" class="section">Implementation rules</text>
<text x="85" y="871" class="body">Each effect gets its own named calculation.</text>
<text x="85" y="899" class="body">Use actual speeds for rotor-dependent effects.</text>
<text x="85" y="927" class="body">Declare N / N·m, frames, coefficients and signs.</text>
<text x="85" y="955" class="body">Do not count gravity, contact or lever torque twice.</text>
<text x="85" y="984" class="small">All new aero effects have YAML switches.</text>
<text x="60" y="1232" class="body">Current motor targets are rad/s, not PWM or RPM. Battery/KV needs an explicit calibrated actuator mapping.</text>
<text x="60" y="1263" class="small">Aero effects are implemented teaching models. Motor lag and battery remain future. See the table and aerodynamic design.</text>
</svg>
