<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img" aria-labelledby="title description">
<title id="title">Force and effect ownership: control, mixer, actuators and physics</title>
<desc id="description">Numbered tips map to rows 1 through 15 in force-implementation-map.md. Controllers request a wrench, the mixer allocates targets, actual motors drive propeller models, and PyBullet applies and integrates forces. Green badges mark implemented effects; amber badges mark future or partial models. Wind and battery are inputs, and lag is dynamics rather than a force.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
  <marker id="future-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b7791f"/></marker>
  <marker id="feedback-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker>
  <style>
    text {font-family: Arial, Helvetica, sans-serif; fill:#17283f}
    .title {font-size:30px;font-weight:700}
    .section {font-size:21px;font-weight:700}
    .label {font-size:19px;font-weight:700}
    .body {font-size:16px;fill:#475569}
