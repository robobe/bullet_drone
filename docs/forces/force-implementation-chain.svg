<text x="85" y="250" class="body">Requests: collective N + body torque N·m</text>
<text x="85" y="278" class="small">Compensation requests ≠ applied physical forces</text>
<text x="525" y="190" class="section">MotorMixer</text>
<text x="525" y="222" class="body">Wrench → four rotor speed targets</text>
<text x="525" y="250" class="body">Thrust / torque models + geometry</text>
<text x="525" y="278" class="small">Allocation only · no physical force application</text>
<text x="905" y="185" class="section">Actuator pipeline · actual rotor speeds</text>
