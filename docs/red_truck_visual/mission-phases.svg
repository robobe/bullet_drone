<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 940" role="img" aria-labelledby="title description">
  <title id="title">Red-truck mission phases</title>
  <desc id="description">After takeoff and search, the drone yaws to center the truck while holding altitude and level attitude. Only after stable horizontal alignment does it begin camera-guided pitch and descent. Target loss enters reacquisition, then centering again.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #172033; }
      .title { font-size: 23px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .detail { font-size: 13px; }
      .edge-label { font-size: 12px; fill: #334155; }
      .edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .center-edge { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .node { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 12; }
      .focus { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; rx: 14; }
      .terminal { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    </style>
  </defs>
  <text class="title" x="340" y="34" text-anchor="middle">Red-truck mission phases</text>

  <ellipse class="terminal" cx="340" cy="74" rx="48" ry="22"/>
  <text class="detail" x="340" y="79" text-anchor="middle">Start</text>
  <path class="edge" d="M340 96 V115"/>

  <rect class="node" x="240" y="118" width="200" height="56"/>
  <text class="label" x="340" y="153" text-anchor="middle">Prearm / Arm</text>
  <path class="edge" d="M340 174 V194"/>

  <rect class="node" x="240" y="197" width="200" height="56"/>
  <text class="label" x="340" y="232" text-anchor="middle">Takeoff</text>
  <path class="edge" d="M340 253 V273"/>

  <rect class="node" x="240" y="276" width="200" height="56"/>
  <text class="label" x="340" y="311" text-anchor="middle">Search</text>
  <text class="edge-label" x="355" y="354">target found</text>
  <path class="center-edge" d="M340 332 V373"/>

  <rect class="focus" x="190" y="376" width="300" height="98"/>
  <text class="label" x="340" y="404" text-anchor="middle">Yaw center</text>
  <text class="detail" x="340" y="428" text-anchor="middle">Hold altitude, level roll and pitch</text>
  <text class="detail" x="340" y="449" text-anchor="middle">Yaw on dx until |dx| ≤ 0.08 for 0.3 s</text>
  <text class="edge-label" x="356" y="496">aligned</text>
  <path class="center-edge" d="M340 474 V515"/>

  <rect class="focus" x="190" y="518" width="300" height="78"/>
  <text class="label" x="340" y="550" text-anchor="middle">Approach</text>
  <text class="detail" x="340" y="574" text-anchor="middle">Begin image-guided roll, pitch and descent</text>

  <rect class="node" x="15" y="520" width="145" height="74"/>
  <text class="label" x="87" y="550" text-anchor="middle">Reacquire</text>
  <text class="detail" x="87" y="573" text-anchor="middle">Hold altitude, yaw search</text>
  <path class="edge" d="M190 547 H162"/>
  <text class="edge-label" x="162" y="535" text-anchor="end">target lost</text>
  <path class="edge" d="M190 424 C150 430, 148 500, 160 530"/>
  <text class="edge-label" x="142" y="455" text-anchor="middle">target lost</text>
  <path class="edge" d="M235 518 C205 485, 175 464, 190 430"/>
  <text class="edge-label" x="153" y="476" text-anchor="middle">target reacquired</text>

  <rect class="node" x="520" y="520" width="145" height="74"/>
  <text class="label" x="592" y="550" text-anchor="middle">Land</text>
  <text class="detail" x="592" y="573" text-anchor="middle">Search / mission timeout</text>
  <path class="edge" d="M440 304 C560 315, 610 390, 592 518"/>
  <text class="edge-label" x="555" y="389">search timeout</text>
  <path class="edge" d="M490 557 H518"/>
  <text class="edge-label" x="505" y="545">mission timeout</text>

  <path class="edge" d="M592 594 V665 H340 V700"/>
  <rect class="node" x="240" y="703" width="200" height="56"/>
  <text class="label" x="340" y="738" text-anchor="middle">Disarmed</text>
  <path class="edge" d="M340 759 V790"/>

  <rect class="terminal" x="250" y="793" width="180" height="56" rx="28"/>
  <text class="label" x="340" y="828" text-anchor="middle">Complete</text>

  <text class="detail" x="340" y="892" text-anchor="middle">Contact also completes the mission from any active phase.</text>
</svg>
