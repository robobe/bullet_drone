# Minimal simulation profile for the packaged 5 kg heavy_quad URDF.
simulation:
  # Physics timestep in seconds; 240 Hz matches the existing simulator baseline.
  timestep_s: 0.004166666666666667
  # Maximum caller-controlled physics steps; 1200 steps represent 5 seconds.
  max_steps: 1200
  # Run headless by default; set true when a desktop display is available.
  gui: false
  # World gravity in m/s^2, with positive world Z upward.
  gravity_m_s2: [0.0, 0.0, -9.81]

drone:
  # Stable identity used in observations and render packets.
  drone_id: drone_1
  # Built-in racer/heavy_quad or a custom four-rotor URDF path; relative paths resolve from this YAML file.
  urdf: heavy_quad
  # Total vehicle mass in kilograms; must match the intended payload configuration.
  mass_kg: 5.0
  # Initial world position in metres.
  initial_position_m: [0.0, 0.0, 1.0]

terrain:
  # Shared float32 terrain asset, resolved relative to this configuration file.
  heightmap_path: ../../terrain/terrain_heightmap.f32
  # Terrain width/depth represented by the shared asset in metres.
  world_size_m: 500.0
  # Heightmap samples along each horizontal axis, including both edges.
  samples_x: 121
  samples_z: 121
  # World-frame X/Y origin of the terrain asset in metres.
  origin_m: [-250.0, -250.0]

sensors:
  # Enable the downward AGL rangefinder sensor reading.
  rangefinder:
    # Enable the body-down terrain measurement.
    enabled: true
    # Maximum range in metres; no terrain return is invalid.
    max_range_m: 50.0
    # Body-frame sensor mount offset in metres.
    mount_position_body_m: [0.0, 0.0, 0.0]

control:
  # Use the generic internal controller; the bundled Betaflight profile remains racer-only.
  backend: internal
